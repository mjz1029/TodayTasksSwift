name: TodayTasks
options:
  bundleIdPrefix: com.mojizhou
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  TodayTasks:
    path: .

targets:
  TodayTasksIOS:
    type: application
    platform: iOS
    sources:
      - path: App/iOS
    dependencies:
      - package: TodayTasks
        product: TodayTasksCore
      - package: TodayTasks
        product: TodayTasksViewModel
      - package: TodayTasks
        product: TodayTasksUI
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: 今日待办
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 换机转移与任务分享需要在同一局域网内发现另一台设备。
        NSBonjourServices:
          - _todaytasks._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mojizhou.todaytasks
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES

  TodayTasksMac:
    type: application
    platform: macOS
    sources:
      - path: App/MacApp
    dependencies:
      - package: TodayTasks
        product: TodayTasksCore
      - package: TodayTasks
        product: TodayTasksViewModel
      - package: TodayTasks
        product: TodayTasksUI
    info:
      path: App/MacApp/Info.plist
      properties:
        CFBundleDisplayName: 今日待办
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSLocalNetworkUsageDescription: 换机转移与任务分享需要在同一局域网内发现另一台设备。
        NSBonjourServices:
          - _todaytasks._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mojizhou.todaytasks.mac
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
